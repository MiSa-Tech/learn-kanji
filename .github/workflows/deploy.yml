name: Build, Dockerize, and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'master'
        type: choice
        options:
          - 'master'
          - 'develop'

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      release_version: ${{ steps.get-version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64

      - name: Set release and backend versions for environment variables
        run: |
          echo "RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout=true | sed 's/-SNAPSHOT//')" >> $GITHUB_ENV
          echo "BACKEND_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout=true)" >> $GITHUB_ENV

      - name: Set release version for output
        id: get-version
        run: echo "release_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout=true | sed 's/-SNAPSHOT//')" >> $GITHUB_OUTPUT

      - name: Build with Maven
        run: mvn clean install

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build --tag=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }} --build-arg="BACKEND_VERSION=${{ env.BACKEND_VERSION }}" $(pwd)

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Display release version
        run: echo "Release version is ${{ needs.build.outputs.release_version }}"

      - name: Set release version as an environment variable
        run: echo "RELEASE_VERSION=${{ needs.build.outputs.release_version }}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            docker stop backend || true
            docker rm backend || true
            docker rmi ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }} || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }}
            docker run -d --name backend -p 8080:8080 -e NEO4J_URI=${{ secrets.NEO4J_URI }} -e NEO4J_USERNAME=${{ secrets.NEO4J_USERNAME }} -e NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }} -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} -e JWT_EXPIRATION_TIME=${{ secrets.JWT_EXPIRATION_TIME }} ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ env.RELEASE_VERSION }}
          EOF