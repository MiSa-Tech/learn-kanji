version: "3.8"

services:
  neo:
    image: neo4j:latest
    container_name: neo
    hostname: neo
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - ./neo4j/data:/data

networks:
  default:
    name: kanji-network